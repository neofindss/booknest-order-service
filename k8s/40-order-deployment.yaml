apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: booknest
  labels:
    app: order-service
    part-of: booknest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        part-of: booknest
    spec:
      containers:
        - name: order
          image: booknest-order:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGODB_URI
              value: mongodb://order-db:27017
            - name: MONGODB_DB
              value: orders
            - name: CATALOG_BASE_URL
              value: http://catalog-service.booknest.svc.cluster.local
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
